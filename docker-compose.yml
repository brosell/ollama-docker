# Usage:
#   GPU only (nvidia): podman-compose --profile gpu up -d
#   GPU only (amd):    podman-compose --profile amd up -d
#   CPU only:          podman-compose --profile cpu up -d
#   All backends:      podman-compose --profile gpu --profile amd --profile cpu up -d
#   UI only:           podman-compose up -d
#
# Tear down (keeps volumes):
#   podman-compose --profile gpu --profile amd --profile cpu down
#
# Pull a model into a specific backend:
#   podman exec ollama-gpu ollama pull deepseek-r1:7b
#   podman exec ollama-amd ollama pull deepseek-r1:7b
#   podman exec ollama-cpu ollama pull codellama:7b
#
# Note: ollama-amd uses ROCm. HSA_OVERRIDE_GFX_VERSION=11.0.0 is set for
#       AMD Strix Halo (Radeon 890M / gfx1151) compatibility. Adjust if needed.

services:

  ollama-gpu:
    profiles: [gpu]
    image: docker.io/ollama/ollama:latest
    container_name: ollama-gpu
    pull_policy: always
    tty: true
    restart: unless-stopped
    ports:
      - 11434:11434
    volumes:
      - ollama-gpu-data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_ORIGINS=*
      - OLLAMA_CONTEXT_LENGTH=32000
    devices:
      - nvidia.com/gpu=all
    networks:
      - ollama-docker

  ollama-amd:
    profiles: [amd]
    image: docker.io/ollama/ollama:rocm
    container_name: ollama-amd
    pull_policy: always
    tty: true
    restart: unless-stopped
    ports:
      - 11436:11434
    volumes:
      - ollama-amd-data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_ORIGINS=*
      - OLLAMA_CONTEXT_LENGTH=32000
      - HSA_OVERRIDE_GFX_VERSION=11.0.0
      # Allow ROCm to use all system RAM beyond the carved-out VRAM (APU/iGPU unified memory)
      - HSA_ENABLE_UNIFIED_MEMORY=1
      # Tell Ollama not to cap VRAM estimation; let it use what ROCm reports
      - OLLAMA_MAX_VRAM=0
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    networks:
      - ollama-docker

  ollama-cpu:
    profiles: [cpu]
    image: docker.io/ollama/ollama:latest
    container_name: ollama-cpu
    pull_policy: always
    tty: true
    restart: unless-stopped
    ports:
      - 11435:11434
    volumes:
      - ollama-cpu-data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_CONTEXT_LENGTH=32000
      - OLLAMA_VULKAN=1
      - OLLAMA_FLASH_ATTENTION=1
    networks:
      - ollama-docker

  ollama-webui:
    profiles: [ui]
    image: ghcr.io/open-webui/open-webui:main
    container_name: ollama-webui
    # pull_policy: always
    volumes:
      - ollama-webui-data:/app/backend/data
    ports:
      - 8080:8080
    environment: # https://docs.openwebui.com/getting-started/env-configuration#default_models
      - OLLAMA_BASE_URLS=http://ollama-gpu:11434;http://ollama-amd:11434;http://ollama-cpu:11434
      - ENV=dev
      - WEBUI_AUTH=False
      - WEBUI_NAME=valiantlynx AI
      - WEBUI_URL=http://localhost:8080
      - WEBUI_SECRET_KEY=t0p-s3cr3t
      - NO_PROXY=${HOST_IP}
    extra_hosts:
      - host.containers.internal:${HOST_IP}
    restart: unless-stopped
    networks:
      - ollama-docker

  openfang:
    profiles: [openfang]
    image: ubuntu:latest
    container_name: openfang
    tty: true
    restart: unless-stopped
    ports:
      - 4200:4200
    volumes:
      - openfang-data:/root/.openfang
    environment:
      - OPENFANG_LISTEN=0.0.0.0:4200
      - DEBIAN_FRONTEND=noninteractive
      - TZ=Etc/UTC
    command:
      - bash
      - -lc
      - |
        set -e
        apt-get update
        apt-get install -y tzdata curl vim
        curl -fsSL https://openfang.sh/install | sh
        export PATH=/root/.openfang/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        openfang init --quick
        cat >/root/.openfang/config.toml <<'EOF'
        api_key = "p"
        api_listen = "0.0.0.0:4200"

        [default_model]
        provider = "ollama"
        model = "gemma4:e4b"
        base_url = "http://ollama-gpu:11434/v1"

        [memory]
        decay_rate = 0.05
        EOF
        openfang start
    networks:
      - ollama-docker

  app:
    profiles: [dev]
    build: .
    ports:
      - 8000:8000
      - 5678:5678
    volumes:
      - .:/code
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    restart: always
    networks:
      - ollama-docker

networks:
  ollama-docker:
    external: false

volumes:
  ollama-gpu-data:
  ollama-amd-data:
  ollama-cpu-data:
  ollama-webui-data:
  openfang-data:
