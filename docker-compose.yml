# Usage:
#   GPU only (nvidia): podman-compose --profile gpu up -d
#   GPU only (amd):    podman-compose --profile amd up -d  # experimental ROCm path
#   Vulkan / AMD iGPU: podman-compose --profile cpu up -d  # recommended on Strix Halo (gfx1151)
#   All backends:      podman-compose --profile gpu --profile amd --profile cpu up -d
#   UI only:           podman-compose up -d
#
# Tear down (keeps volumes):
#   podman-compose --profile gpu --profile amd --profile cpu down
#
# Pull a model into a specific backend:
#   podman exec ollama-gpu ollama pull deepseek-r1:7b
#   podman exec ollama-amd ollama pull deepseek-r1:7b
#   podman exec ollama-cpu ollama pull codellama:7b
#
# NOTE:
#   On AMD Strix Halo (gfx1151), the ROCm HIP stack is still unstable and often
#   silently falls back to CPU. The Vulkan-backed path is the safer default.
#   Keep the "cpu" profile as the Strix Halo / iGPU path unless you are testing
#   ROCm-specific fixes.
#
# SECURITY (SSH bastion):
#   The Ollama backends (ollama-gpu/amd/cpu) no longer publish their ports to
#   the host. They are reachable ONLY over the internal "ollama-docker" network,
#   and the sole entry point is the "bastion" service (ssh on host port 2222,
#   key-only). Users forward with:
#     ssh -L 11434:ollama-gpu:11434 -p 2222 relay@YOUR_HOST_IP
#   then point their OpenAI client at http://localhost:11434/v1
#   Manage per-user keys in ./bastion/config/authorized_keys.
#
#   LAN access: the Ollama backends are ALSO published on ${HOST_IP} (your LAN
#   IP), so devices on your local network can reach them directly at
#   http://HOST_IP:11434/v1 with NO auth. External access goes through the
#   bastion (key-only). Set HOST_IP in .env (see .env.example / ./gen-env.sh).
#   The ollama-webui keeps its port 8080 (owner-facing UI, not exposed via the
#   bastion). Run everything:
#     podman-compose --profile gpu --profile amd --profile cpu --profile ui --profile bastion up -d

services:

  ollama-gpu:
    profiles: [gpu]
    image: docker.io/ollama/ollama:latest
    container_name: ollama-gpu
    pull_policy: always
    tty: true
    restart: unless-stopped
    # LAN-only publish (bound to ${HOST_IP}); NOT on the public interface.
    # External users reach this backend through the SSH bastion instead.
    ports:
      - "${HOST_IP}:11434:11434"
    volumes:
      - ollama-gpu-data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_ORIGINS=*
      - OLLAMA_CONTEXT_LENGTH=32000
    devices:
      - nvidia.com/gpu=all
    networks:
      - ollama-docker

  ollama-amd:
    profiles: [amd]
    # Strix Halo (gfx1151) ROCm path — experimental, may still have HIP page-fault bugs.
    # Use this if ollama-cpu Vulkan path reports 0 VRAM / 100% CPU.
    # Check with: podman exec ollama-amd ollama ps
    image: docker.io/ollama/ollama:rocm
    container_name: ollama-amd
    pull_policy: always
    tty: true
    restart: unless-stopped
    # LAN-only publish (bound to ${HOST_IP}); NOT on the public interface.
    # External users reach this backend through the SSH bastion instead.
    ports:
      - "${HOST_IP}:11436:11434"
    volumes:
      - ollama-amd-data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_ORIGINS=*
      - OLLAMA_HOST=0.0.0.0
      # 262144 tokens fits in 128 GB but is aggressive; reduce to 65536 for 70B+ models
      - OLLAMA_CONTEXT_LENGTH=65536
      # gfx1151 (Strix Halo / Radeon 8060S) — 11.5.0 is more correct than 11.0.0
      - HSA_OVERRIDE_GFX_VERSION=11.5.0
      # Let ROCm use unified RAM beyond firmware-carved VRAM
      - HSA_ENABLE_UNIFIED_MEMORY=1
      # Disable SDMA — known to help on gfx1151
      - HSA_ENABLE_SDMA=0
      # Avoid HIP graph capture — silent corruption bug on gfx1151
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_NUM_PARALLEL=1
      # Increase this to load multiple models simultaneously — but watch for ROCm instability on gfx1151
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_DEBUG=1
      # Required: Ollama drops iGPUs by default; this re-enables the Strix Halo iGPU
      - OLLAMA_IGPU_ENABLE=1
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    networks:
      - ollama-docker

  ollama-cpu:
    profiles: [cpu]
    image: docker.io/ollama/ollama:latest
    container_name: ollama-cpu
    pull_policy: always
    tty: true
    restart: unless-stopped
    # LAN-only publish (bound to ${HOST_IP}); NOT on the public interface.
    # External users reach this backend through the SSH bastion instead.
    ports:
      - "${HOST_IP}:11435:11434"
    volumes:
      - ollama-cpu-data:/root/.ollama
      - /dev/dri:/dev/dri
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_CONTEXT_LENGTH=32768
      - OLLAMA_VULKAN=1
      - OLLAMA_FLASH_ATTENTION=1
      - HSA_OVERRIDE_GFX_VERSION=11.5.0
      - OLLAMA_DEBUG=1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_GPU_OVERHEAD=0
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    networks:
      - ollama-docker

  ollama-webui:
    profiles: [ui]
    image: ghcr.io/open-webui/open-webui:main
    container_name: ollama-webui
    # pull_policy: always
    volumes:
      - ollama-webui-data:/app/backend/data
    ports:
      - 8080:8080
    environment: # https://docs.openwebui.com/getting-started/env-configuration#default_models
      - OLLAMA_BASE_URLS=http://ollama-gpu:11434;http://ollama-amd:11434;http://ollama-cpu:11434
      - ENV=dev
      - WEBUI_AUTH=False
      - WEBUI_NAME=valiantlynx AI
      - WEBUI_URL=http://localhost:8080
      - WEBUI_SECRET_KEY=t0p-s3cr3t
      - NO_PROXY=${HOST_IP}
    extra_hosts:
      - host.containers.internal:${HOST_IP}
    restart: unless-stopped
    networks:
      - ollama-docker



  app:
    profiles: [dev]
    build: .
    ports:
      - 8000:8000
      - 5678:5678
    volumes:
      - .:/code
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    restart: always
    networks:
      - ollama-docker

  # SSH bastion: key-only login, local TCP forwarding to the Ollama backends.
  # This is the ONLY public entry point. Backends are internal-only.
  bastion:
    profiles: [bastion]
    image: ghcr.io/linuxserver/openssh-server:latest
    container_name: bastion
    pull_policy: always
    restart: unless-stopped
    ports:
      - "2222:2222"
    environment:
      - PUID=1000
      - PGID=1000
      - USER_NAME=relay
      - PASSWORD_ACCESS=false   # key-only
      - PUBLIC_KEY_FILE=/config/authorized_keys   # read keys from this mounted file
      # NOTE: key sync is NOT done by this var alone. The image's init appends
      # PUBLIC_KEY_FILE into /config/.ssh/authorized_keys with a broken dedupe
      # guard (removals stay invisible). A custom-init script mounted at
      # /custom-cont-init.d (auto-run on start by the image) OVERWRITES the
      # effective file from the source instead. See that script's header.
      - TZ=UTC
    volumes:
      - ./bastion/config:/config   # source of truth for keys (authorized_keys)
      # custom-init script that overwrites /config/.ssh/authorized_keys from the
      # source on every start (the image runs executable scripts here on boot).
      - ./bastion/config/custom-cont-init.d:/custom-cont-init.d
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - ollama-docker

networks:
  ollama-docker:
    external: false

volumes:
  ollama-gpu-data:
  ollama-amd-data:
  ollama-cpu-data:
  ollama-webui-data:
