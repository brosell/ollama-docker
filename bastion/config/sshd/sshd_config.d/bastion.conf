# Bastion hardening — applied automatically via the image's Include hook.
#
# The linuxserver/openssh-server image generates a STOCK /config/sshd/sshd_config
# on every startup, but prepends this snippet first (see
# /etc/s6-overlay/s6-rc.d/init-openssh-server-config/run). sshd is first-match-wins,
# so each directive below overrides the stock base (e.g. AllowTcpForwarding local
# beats the stock "AllowTcpForwarding no").
#
# This is the single source of truth for bastion policy. It is NOT secret — it is
# safe to commit. The generated /config/sshd/sshd_config is runtime state and stays
# gitignored; this .d/ snippet is tracked.

# --- Authentication: key-only ---
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PubkeyAuthentication yes

# --- Restrict forwarding to local (-L) only, to the Ollama backends ---
# The default (no per-key permitopen) allows local forwarding to ANY host:port.
# To lock a key down, add a Match User/Key-based line per user below, e.g.:
#   Match User relay
#     PermitOpen ollama-gpu:11434 ollama-cpu:11435 ollama-amd:11436
AllowTcpForwarding local
GatewayPorts no
PermitTunnel no

# --- Hardening ---
X11Forwarding no
AllowAgentForwarding no
AllowStreamLocalForwarding no
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2

# --- Logging (for audit: who connected, with which key) ---
LogLevel VERBOSE
SyslogFacility AUTH

# --- Shell: drop to a non-interactive shell so the account is forward-only ---
# NOTE: on the linuxserver/openssh-server image nologin lives at /sbin/nologin
# (busybox). /usr/sbin/nologin does NOT exist and would make every login fail.
ForceCommand /sbin/nologin
